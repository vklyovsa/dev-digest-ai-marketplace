schema_version: "1.1"
name: spec-and-plan
description: >
  The fixed SDD scenario used for the cost baseline: the user asks for a spec and a plan of a
  small feature in an existing repository. spec-creator writes the spec, the session approves
  it on the user's standing instruction, implementation-planner plans from it, nothing is
  implemented.
tags: [baseline, sdd]
plugins: [../../../engineering-paved-path, ../../../research-tools, ../../../architecture-review, ../..]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Agent, SendMessage, Read, Glob, Grep, Bash, Write, Edit, Skill]
  prompt: |
    I want tags on notes in this repository: a note can carry a few short tags, and
    `GET /notes` can be filtered by one tag. Prepare the spec and then the implementation
    plan with the sdd-engineering workflow. Do not implement anything.

    Standing instructions for this run, because I am not available to answer:
    - For every question an agent asks, take its recommended option.
    - When the spec's self-check passes, treat my approval as given: set it to approved.
    - Execution mode for the plan: single-agent.
    - Save the plan file next to the spec.
    - Last step, for my reviewer: copy the final spec to `specs/_review/spec.md` and the plan to
      `specs/_review/plan.md` (plain `mkdir -p` + `cp`).
graders:
  - name: spec-creator-ran
    type: tool_used
    tool: Agent
    input_match: 'sdd-engineering:spec-creator'
  - name: planner-ran
    type: tool_used
    tool: Agent
    input_match: 'sdd-engineering:implementation-planner'
  - name: no-implementer
    type: tool_used
    tool: Agent
    input_match: 'sdd-engineering:implementer'
    min: 0
    max: 0
  - name: spec-file
    type: file_exists
    path: 'specs/*tag*.md'
  - name: plan-file
    type: file_exists
    path: 'specs/*-plan.md'
  - name: review-copies
    type: file_exists
    path: 'specs/_review/plan.md'
  - name: spec-approved
    type: regex
    target: {source: file, path: specs/_review/spec.md}
    pattern: '^\*{0,2}Status:?\*{0,2}:?\s*approved'
    flags: im
  - name: spec-ears
    type: regex
    target: {source: file, path: specs/_review/spec.md}
    pattern: '\b(WHEN|IF|WHILE|WHERE)\b[^\n]{0,400}\bshall\b'
    flags: i
  - name: spec-ac-ids
    type: regex
    target: {source: file, path: specs/_review/spec.md}
    pattern: '\bAC-\d+\b'
  - name: spec-edge-cases
    type: regex
    target: {source: file, path: specs/_review/spec.md}
    pattern: '^#+ .*edge cases'
    flags: im
  - name: spec-tag-limit
    type: regex
    target: {source: file, path: specs/_review/spec.md}
    pattern: '(at most|up to|more than|maximum|max\.?|limit)[^\n]{0,60}\b\d+\b[^\n]{0,30}tags?'
    flags: i
  - name: spec-filter
    type: regex
    target: {source: file, path: specs/_review/spec.md}
    pattern: 'GET /notes\?tag='
  - name: spec-no-code
    type: regex
    target: {source: file, path: specs/_review/spec.md}
    pattern: '```(js|javascript|ts|typescript)\b'
    match: not_contains
  - name: spec-acs-no-code
    type: regex
    target: {source: file, path: specs/_review/spec.md}
    pattern: '^\s*-\s*\*\*AC-\d+\*\*(?:(?!— covers:)[^\n])*?(\b[\w-]+\.(js|ts|mjs)\b|\b[a-z][A-Za-z]+\(\)|\bfunction\b)'
    flags: m
    match: not_contains
  - name: plan-cites-spec
    type: regex
    target: {source: file, path: specs/_review/plan.md}
    pattern: '^\**Source:?\**:?.*specs/\S*tag\S*\.md'
    flags: im
  - name: plan-references-acs
    type: regex
    target: {source: file, path: specs/_review/plan.md}
    pattern: '\bAC-\d+\b'
  - name: plan-has-stages
    type: regex
    target: {source: file, path: specs/_review/plan.md}
    pattern: '^#{2,4} .*Stage \d'
    flags: im
  - name: plan-check-command
    type: regex
    target: {source: file, path: specs/_review/plan.md}
    pattern: 'npm test|node --test'
  - name: plan-routing-layer
    type: regex
    target: {source: file, path: specs/_review/plan.md}
    pattern: 'src/server\.js'
  - name: plan-behaviour-layer
    type: regex
    target: {source: file, path: specs/_review/plan.md}
    pattern: 'src/notes\.js'
  - name: nothing-implemented
    type: llm
    focus: trace
    criteria: |
      PASS if no file under src/ or test/ was created or modified during the run (only files
      under specs/ were written; ignore .git/, which the eval harness
      writes). FAIL if any source or test file was edited.

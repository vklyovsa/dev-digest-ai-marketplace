schema_version: "1.1"
name: spec-and-plan
description: >
  The fixed SDD scenario used for the cost baseline: the user asks for a spec and a plan of a
  small feature in an existing repository. spec-creator writes the spec, the session approves
  it on the user's standing instruction, implementation-planner plans from it, nothing is
  implemented.
tags: [baseline, sdd]
plugins: [../../../engineering-paved-path, ../../../research-tools, ../../../architecture-review, ../..]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Agent, SendMessage, Read, Glob, Grep, Bash, Write, Edit, Skill]
  prompt: |
    I want tags on notes in this repository: a note can carry a few short tags, and
    `GET /notes` can be filtered by one tag. Prepare the spec and then the implementation
    plan with the sdd-engineering workflow. Do not implement anything.

    Standing instructions for this run, because I am not available to answer:
    - For every question an agent asks, take its recommended option.
    - When the spec's self-check passes, treat my approval as given: set it to approved.
    - Execution mode for the plan: single-agent.
    - Save the plan file next to the spec.
    - Last step, for my reviewer: copy the final spec to `specs/_review/spec.md` and the plan to
      `specs/_review/plan.md` (plain `mkdir -p` + `cp`).
graders:
  - name: spec-creator-ran
    type: tool_used
    tool: Agent
    input_match: 'sdd-engineering:spec-creator'
  - name: planner-ran
    type: tool_used
    tool: Agent
    input_match: 'sdd-engineering:implementation-planner'
  - name: no-implementer
    type: tool_used
    tool: Agent
    input_match: 'sdd-engineering:implementer'
    min: 0
    max: 0
  - name: spec-file
    type: file_exists
    path: 'specs/*tag*.md'
  - name: plan-file
    type: file_exists
    path: 'specs/*-plan.md'
  - name: review-copies
    type: file_exists
    path: 'specs/_review/plan.md'
  - name: spec-quality
    type: llm
    focus: {source: file, path: specs/_review/spec.md}
    criteria: |
      This is the spec. PASS if all hold: requirements (user stories, goals or functional
      requirements) carry IDs; every one of them is covered by at least one acceptance criterion;
      acceptance criteria are written in EARS form (When/While/If/Where … the system shall …);
      it covers a limit on tags per note and the GET /notes filter by one tag; it lists edge
      cases (e.g. unknown tag, too many tags, invalid tag); it contains no implementation detail
      such as function names, code snippets or file-by-file changes; its status says approved.
      FAIL otherwise, naming the first rule broken.
  - name: plan-quality
    type: llm
    focus: {source: file, path: specs/_review/plan.md}
    criteria: |
      This is the implementation plan. PASS if all hold: it names the spec file as its source;
      its stages reference acceptance-criterion (or requirement) IDs of the spec; it states no
      new requirement of its own (recommendations kept apart from the scope are fine); it names
      `npm test` or `node --test` as the verification command; it keeps routing in
      src/server.js and behaviour in src/notes.js.
      FAIL otherwise, naming the first rule broken.
  - name: nothing-implemented
    type: llm
    focus: trace
    criteria: |
      PASS if no file under src/ or test/ was created or modified during the run (only files
      under specs/ were written; ignore .git/, which the eval harness
      writes). FAIL if any source or test file was edited.
